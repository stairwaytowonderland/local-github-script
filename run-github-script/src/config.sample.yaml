name: Run GitHub Script
description: Configuration file for the run-github-script project.

# Path to the directory containing custom modules.
module-path: modules

# Path to the environment file containing necessary variables.
env-file: .env

# Whether to use a global Octokit instance for all modules.
global-octokit: true

modules:
  - name: Hello World
    description: A local test wrapper module.
    ci: true
    id: hello-world
    path: hello-world.js
    step-summary: true
    env:
      EXAMPLE_ENV_VAR: example_value
      GITHUB_TOKEN: example_bad_token
    inputs:
      example_input: example_value
