name: 🔄 CI

permissions:
  contents: read

on: [push, pull_request]

jobs:
  lint:
    uses: ./.github/workflows/lint.yaml
    with:
      node-version: |
        24
        26

  test:
    uses: ./.github/workflows/test.yaml
    with:
      node-version: |
        24
        26
    secrets: inherit
