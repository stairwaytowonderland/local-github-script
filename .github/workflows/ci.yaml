name: CI

permissions:
  contents: read

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: run-github-script/package-lock.json
      - name: Install dependencies
        run: npm --prefix run-github-script ci --ignore-scripts
      - name: Run lint
        run: npm --prefix run-github-script run check:lint
      - name: Run prettier
        run: npm --prefix run-github-script run check:format
