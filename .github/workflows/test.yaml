name: Test

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      node-version:
        required: true
        type: choice
        options:
          - '20'
          - '22'
          - '24'
          - '26'
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          NODE_VERSIONS: ${{ inputs.node-version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node_versions="$NODE_VERSIONS"
            echo "matrix=[\"$node_versions\"]" >> $GITHUB_OUTPUT
          else
            # Split by comma, trim whitespace, and format as a JSON array
            IFS=',' read -r -a array <<< "$NODE_VERSIONS"
            # Clean spaces and build JSON array like ["20","22","24"]
            json_array=$(printf '%s\n' "${array[@]}" | jq -R . | jq -s -c .)
            echo "matrix=$json_array" >> $GITHUB_OUTPUT
          fi

  test:
    runs-on: ubuntu-latest
    needs: parse
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.parse.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: run-github-script/package-lock.json
      - name: Install dependencies
        run: npm --prefix run-github-script ci
      - name: Test sample module
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm --prefix run-github-script start
