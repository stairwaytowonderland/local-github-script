name: 🔔 CI Tests

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      node-version:
        required: true
        type: choice
        options:
          - '20'
          - '22'
          - '24'
          - '26'
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          NODE_VERSIONS: ${{ inputs.node-version }}
          IS_WORKFLOW_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$IS_WORKFLOW_DISPATCH" = "true" ]; then
            json_array=[\"$NODE_VERSIONS\"]
          else
            # Read raw text, split by any whitespace/newlines, remove empty strings, and compact to JSON
            json_array=$(printf '%s' "$NODE_VERSIONS" | jq -R -s -c '[splits("\\s+")] | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          fi
          echo "matrix=$json_array" >> $GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    needs: parse
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.parse.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: run-github-script/package-lock.json
      - name: Install dependencies
        run: npm --prefix run-github-script ci
      - name: Test sample module
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm --prefix run-github-script start
